<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="lobby" class="app-container glass-panel">
        <h1 class="logo-text">BINGO</h1>
        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; width: 100%;">
            <input type="text" id="player-name" placeholder="Your Name" class="glass-panel-inner"
                style="color: white; padding: 10px; border: 1px solid var(--glass-border); background: transparent;">
            <input type="text" id="room-id" placeholder="Room ID" class="glass-panel-inner"
                style="color: white; padding: 10px; border: 1px solid var(--glass-border); background: transparent;">
            <input type="number" id="max-number" placeholder="Max Number (min 25)" min="25" value="25" class="glass-panel-inner"
                style="color: white; padding: 10px; border: 1px solid var(--glass-border); background: transparent;">
            <button id="join-btn" class="btn primary-btn">Join Game</button>
        </div>
        <p id="lobby-message" style="margin-top: 15px; color: #ff007f;"></p>
    </div>

    <main id="game-ui" class="app-container glass-panel force-hidden">
        <header>
            <h1 class="logo-text">BINGO</h1>
            <p id="player-names" style="color: var(--secondary-color); margin-top: 10px; font-weight: bold; font-size: 1.1rem;"></p>
            <p id="room-status" style="color: #ccc; margin-top: 5px;">Waiting for opponent...</p>
        </header>

        <section class="game-info">
            <div class="caller-display glass-panel-inner">
                <p>Current Draw</p>
                <h2 id="current-draw">--</h2>
            </div>
            <!-- Manual draw panel: only visible to the host -->
            <div id="draw-panel" class="draw-panel hidden">
                <p id="draw-error" style="color: #ff007f; font-size: 0.85rem; margin: 0;"></p>
            </div>
        </section>

        <section class="board-section">
            <div id="bingo-board" class="bingo-board">
                <!-- Board will be generated by JS -->
            </div>

            <div id="win-message" class="win-message hidden">
                <h2 id="winner-name-display">BINGO!</h2>
                <p>Game Over</p>
                <button id="restart-btn" class="btn primary-btn" style="margin-top: 15px;">Restart Game</button>
            </div>
        </section>

        <section class="history-section">
            <h3>Called Numbers</h3>
            <div id="called-numbers" class="called-numbers glass-panel-inner">
                <!-- Numbers will appear here -->
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
