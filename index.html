<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="lobby" class="app-container glass-panel">
        <h1 class="logo-text">BINGO</h1>

        <div class="lobby-field">
            <label for="player-name" class="field-label">Your Name</label>
            <input type="text" id="player-name" placeholder="Enter your name" class="glass-panel-inner lobby-input" maxlength="20" autocomplete="off">
        </div>

        <div class="lobby-tabs">
            <button type="button" id="tab-create" class="lobby-tab active">➕ Create Room</button>
            <button type="button" id="tab-join" class="lobby-tab">🔗 Join Room</button>
        </div>

        <!-- Create Room Panel -->
        <div id="panel-create" class="lobby-panel">
            <div class="lobby-field">
                <label for="create-room-id" class="field-label">Room ID</label>
                <div class="input-with-action">
                    <input type="text" id="create-room-id" placeholder="e.g. room123" class="glass-panel-inner lobby-input" maxlength="20" autocomplete="off">
                    <button type="button" id="btn-random-room" class="chip-btn" title="Generate Random Room ID">🎲</button>
                </div>
            </div>

            <div class="lobby-field">
                <div class="field-label-row">
                    <label class="field-label">Max Numbers</label>
                    <span class="field-hint">(Game range: 1 to N)</span>
                </div>
                <div class="preset-chips">
                    <button type="button" class="preset-chip active" data-val="25">25</button>
                    <button type="button" class="preset-chip" data-val="50">50</button>
                    <button type="button" class="preset-chip" data-val="75">75</button>
                    <button type="button" class="preset-chip" data-val="100">100</button>
                </div>
                <input type="number" id="create-max-number" placeholder="Custom Max (min 25)" min="25" max="500" value="25" class="glass-panel-inner lobby-input" style="margin-top: 8px;">
            </div>

            <button id="create-room-btn" class="btn primary-btn lobby-submit-btn">Create Room</button>
        </div>

        <!-- Join Room Panel -->
        <div id="panel-join" class="lobby-panel hidden">
            <div class="lobby-field">
                <label for="join-room-id" class="field-label">Room ID</label>
                <input type="text" id="join-room-id" placeholder="Enter Room ID to join" class="glass-panel-inner lobby-input" maxlength="20" autocomplete="off">
            </div>
            <p class="panel-note">The room creator sets the max number.</p>
            <button id="join-room-btn" class="btn primary-btn lobby-submit-btn">Join Room</button>
        </div>

        <p id="lobby-message" class="lobby-msg"></p>
    </div>

    <main id="game-ui" class="app-container glass-panel force-hidden">
        <header>
            <h1 class="logo-text">BINGO</h1>
            <p id="player-names" style="color: var(--secondary-color); margin-top: 10px; font-weight: bold; font-size: 1.1rem;"></p>
            <p id="room-status" style="color: #ccc; margin-top: 5px;">Waiting for opponent...</p>
        </header>

        <section class="game-info">
            <div class="caller-display glass-panel-inner">
                <p>Current Draw</p>
                <h2 id="current-draw">--</h2>
            </div>
            <!-- Manual draw panel: only visible to the host -->
            <div id="draw-panel" class="draw-panel hidden">
                <p id="draw-error" style="color: #ff007f; font-size: 0.85rem; margin: 0;"></p>
            </div>
        </section>

        <section class="board-section">
            <div id="bingo-board" class="bingo-board">
                <!-- Board will be generated by JS -->
            </div>

            <div id="win-message" class="win-message hidden">
                <h2 id="winner-name-display">BINGO!</h2>
                <p>Game Over</p>
                <button id="restart-btn" class="btn primary-btn" style="margin-top: 15px;">Restart Game</button>
            </div>
        </section>

        <section class="history-section">
            <h3>Called Numbers</h3>
            <div id="called-numbers" class="called-numbers glass-panel-inner">
                <!-- Numbers will appear here -->
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
